app-id: com.gitlab.ColinDuquesnoy.MellowPlayer
runtime: org.kde.Platform
runtime-version:  "5.15-23.08"
base: io.qt.qtwebengine.BaseApp
base-version: "5.15-23.08"
sdk: org.kde.Sdk
command: MellowPlayer
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.mpris.MediaPlayer2.Player
  - --own-name=org.mpris.MediaPlayer2.MellowPlayer3.*
  - --env=TMPDIR=/var/tmp
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.gnome.SessionManager
rename-desktop-file: "mellowplayer.desktop"
rename-icon: "mellowplayer"
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: libnotify
    buildsystem: meson
    config-opts:
      - -Dtests=false
      - -Dintrospection=disabled
      - -Dman=false
      - -Dgtk_doc=false
      - -Ddocbook_docs=disabled
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libnotify/0.8/libnotify-0.8.7.tar.xz
        sha256: 4be15202ec4184fce1ac15997ece5530d2be32fe9573875aeb10e3b573858748
        x-checker-data:
          project-id: 13149
          type: anitya
          url-template: https://download.gnome.org/sources/libnotify/$major.$minor/libnotify-$version.tar.xz
          
  - name: MellowPlayer
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://gitlab.com/ColinDuquesnoy/MellowPlayer
        tag: "3.6.8"
        commit: "4d5412f9fab8d57c37aa0126fff09fba5c9deb6a"
